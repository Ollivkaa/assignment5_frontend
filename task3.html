<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 3 — Ticket Builder</title>
  <link rel="stylesheet" href="task3.css">
  <script src="task3.js" defer></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html">✿ Pink Board</a>
    <nav class="nav" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="task1.html">Task 1</a>
      <a href="task2.html">Task 2</a>
      <a href="task3.html" aria-current="page">Task 3</a>
    </nav>
  </header>

  <main class="wrap">
    <h1 class="page-title">Ticket builder</h1>
    <p class="lead">Fill in the form. The ticket preview changes while you type, and every mistake is explained under its field.</p>

    <div class="layout">
      <section class="panel" aria-label="Booking form">
        <div id="summary" class="summary" role="alert" tabindex="-1" hidden></div>

        <form id="ticket-form" novalidate>
          <div class="field">
            <label for="eventId">Event</label>
            <select id="eventId" name="eventId" required aria-describedby="err-eventId">
              <option value="">Choose an event</option>
            </select>
            <p class="error" id="err-eventId"></p>
          </div>

          <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" required aria-describedby="err-date">
            <p class="error" id="err-date"></p>
          </div>

          <div class="field">
            <label for="ticketType">Ticket type</label>
            <select id="ticketType" name="ticketType" required aria-describedby="err-ticketType">
              <option value="">Choose a ticket type</option>
            </select>
            <p class="error" id="err-ticketType"></p>
          </div>

          <div class="field">
            <label for="qty">Quantity</label>
            <input type="number" id="qty" name="qty" min="1" max="10" required aria-describedby="err-qty">
            <p class="error" id="err-qty"></p>
          </div>

          <div class="field">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" name="fullName" minlength="5" maxlength="40" required
                   autocomplete="name" aria-describedby="err-fullName">
            <p class="error" id="err-fullName"></p>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email"
                   aria-describedby="err-email">
            <p class="error" id="err-email"></p>
          </div>

          <div class="field">
            <label for="promo">Promo code (optional)</label>
            <input type="text" id="promo" name="promo" maxlength="20" aria-describedby="promo-hint err-promo">
            <p class="hint" id="promo-hint">Try SAVE10 or STUDENT20.</p>
            <p class="error" id="err-promo"></p>
          </div>

          <button type="submit" class="btn">Book tickets</button>
        </form>
      </section>

      <aside class="side" aria-label="Preview and result">
        <section class="panel">
          <h2>Ticket preview</h2>
          <div id="preview" class="ticket" aria-live="polite"></div>
        </section>
        <div id="result"></div>
      </aside>
    </div>
  </main>

  <footer class="foot">Assignment 5 · JavaScript Basics</footer>
</body>
</html>
